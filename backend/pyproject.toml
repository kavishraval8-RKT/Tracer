[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers"]

[project]
name = "tracer-backend"
version = "0.1.0"
description = "Tracer Copilot cloud backend — auth, quota, LLM proxy."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",                  # HS256 verify — small, well-audited
    "httpx>=0.27",                 # Supabase REST calls + async LLM later
    "google-generativeai>=0.8",    # Gemini upstream (used by agent.py)
    "pillow>=10.0",                # PIL — attachments path in agent.py
    "requests>=2.32",              # agent.py uses it internally
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
